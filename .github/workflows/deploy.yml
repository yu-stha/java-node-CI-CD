name: Deploy Apps

on:
  push:
    branches:
      - main

jobs:
  deploy-node:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and run Node app
        run: |
          cd node
          docker build -t node-image .
          docker stop node-image
          docker ps
          docker rm node-image || true
          docker run -d --name node-app --network hw node-app

      - name: Verify Node deployment
        run: |
          sleep 10
          curl http://localhost:3000

  deploy-java:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and run Spring Boot app
        run: |
          cd java
          docker build -t java-image .
          docker stop java-image || true
          docker rm java-image || true
          docker run -d --name java-app --network hw java-image

      - name: Verify Java deployment
        run: |
          sleep 10
          curl http://localhost:8080
  
  deploy-reverse-proxy:
    needs: deploy-node 
    needs: deploy-java

    runs-on: self-hosted
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name : Build and deploy reverse proxy
        run: |
          cd reverse-proxy
          docker build -t proxy-image .
          docker run -d --name lab --network hw proxy-image

      - name: verify communication
        run: |
          docker exec -it java-app ping -n 4 node-app
          docker exec -it java-app ping -n 4 lab


